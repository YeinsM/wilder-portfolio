name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lint authored source
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install thumbnail automation dependencies
        run: npm ci --prefix scripts/thumbnails

      - name: Test thumbnail automation
        run: node --test scripts/thumbnails/update.test.mjs
